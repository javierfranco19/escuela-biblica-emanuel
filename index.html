<style>*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:linear-gradient(135deg,#102a43,#167b9b);min-height:100vh}.box{max-width:1050px;margin:35px auto;background:#fff;padding:30px;border-radius:22px;box-shadow:0 15px 45px #0005;color:#243b53}h1,h2{text-align:center}input,button{padding:12px;border-radius:10px;border:1px solid #bcccdc;font-size:15px}button{background:#167aa3;color:#fff;border:0;font-weight:700;cursor:pointer}.hidden{display:none}.center{text-align:center}.panel,.student{margin-top:20px;padding:18px;background:#f2f7fa;border-radius:15px}.cards,.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.card{padding:15px;background:#fff;border-radius:12px;text-align:center}.card b{display:block;font-size:24px;color:#167aa3}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input{width:100%}.head{display:flex;justify-content:space-between;align-items:center}.danger{background:#b83227}.teacher{margin-top:30px}.teacher button{background:#627d98}.chart{height:220px;display:flex;align-items:flex-end;gap:18px;background:#fff;padding:20px 20px 35px;border-radius:12px}.bw{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}.bar{background:linear-gradient(#38a8d1,#16749a);border-radius:7px 7px 0 0}.lbl{font-size:12px;margin-top:5px}
.brand{display:flex;align-items:center;gap:24px;padding:8px 10px 25px;border-bottom:1px solid #e5edf3;margin-bottom:28px}
.brand img{width:125px;height:125px;object-fit:cover;border-radius:50%;box-shadow:0 5px 18px #0002}
.brandtext h1{margin:0;text-align:left;font-size:38px;color:#123b70}.brandtext p{margin:8px 0 0;color:#526d82;font-size:18px}

const SUPABASE_URL="https://pbltglzlhdxbyckawytl.supabase.co";
const SUPABASE_KEY="sb_publishable_JoKqZmOf24YYatekuR8e1Q_Vem7Cg0W";
let data=[]; let accessToken=null;
function pesos(aula){return aula==="Primer Nivel B"?{ex:75,ta:25}:{ex:80,ta:20}}
function calc(e){let p=pesos(e.aula),t=Math.max(0,Math.min(p.ta,+e.tarea||0)),xs=e.examenes.map(x=>Math.max(0,Math.min(100,+x||0))),avg=xs.reduce((a,b)=>a+b,0)/5,xw=avg*(p.ex/100);return{t,xs,avg,xw,total:t+xw,p}}
function login(){sv.classList.add("hidden");lv.classList.remove("hidden");setTimeout(()=>email.focus(),50)}
async function entrar(){const correo=email.value.trim(),clave=pw.value;if(!correo||!clave){loginmsg.textContent="Ingresa correo y contraseña.";return}loginmsg.textContent="Verificando acceso...";try{const r=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY},body:JSON.stringify({email:correo,password:clave})});const j=await r.json();if(!r.ok||!j.access_token)throw new Error();accessToken=j.access_token;pw.value="";loginmsg.textContent="";lv.classList.add("hidden");pv.classList.remove("hidden");await cargarEstudiantes()}catch(e){loginmsg.textContent="Correo o contraseña incorrectos."}}
function inicio(){lv.classList.add("hidden");pv.classList.add("hidden");sv.classList.remove("hidden");loginmsg.textContent=""}
async function cerrarSesion(){accessToken=null;data=[];lista.innerHTML="";email.value="";pw.value="";inicio()}
function authHeaders(extra={}){return {apikey:SUPABASE_KEY,Authorization:"Bearer "+accessToken,...extra}}
async function cargarEstudiantes(){lista.innerHTML='<div class="panel">Cargando estudiantes...</div>';try{const r=await fetch(SUPABASE_URL+'/rest/v1/estudiantes?select=id,codigo,nombre,aula,examen1,examen2,examen3,examen4,examen5,tareas&order=aula.asc,nombre.asc',{headers:authHeaders()});if(!r.ok)throw new Error(await r.text());const rows=await r.json();data=rows.map(a=>({dbid:a.id,id:a.codigo,nombre:a.nombre,aula:a.aula||"Tercer Nivel",tarea:Number(a.tareas)||0,examenes:[a.examen1,a.examen2,a.examen3,a.examen4,a.examen5].map(v=>Number(v)||0)}));render()}catch(e){lista.innerHTML='<div class="panel">No se pudieron cargar los estudiantes.</div>';console.error(e)}}
function nuevoID(){let x;do{x=String(Math.floor(1000+Math.random()*9000))}while(data.some(e=>String(e.id)===x));return x}
async function agregar(){let n=prompt("Nombre del nuevo estudiante:");if(n===null)return;n=n.trim();if(!n)return alert("Escribe un nombre.");let aula=prompt("Aula: escribe Tercer Nivel, Primer Nivel A o Primer Nivel B",filtroAula.value!=="Todos"?filtroAula.value:"Tercer Nivel");if(!["Tercer Nivel","Primer Nivel A","Primer Nivel B"].includes(aula))return alert("Aula no válida.");let codigo=nuevoID();try{const r=await fetch(SUPABASE_URL+'/rest/v1/estudiantes',{method:'POST',headers:authHeaders({'Content-Type':'application/json','Prefer':'return=representation'}),body:JSON.stringify({codigo,nombre:n,aula,examen1:0,examen2:0,examen3:0,examen4:0,examen5:0,tareas:0})});if(!r.ok)throw new Error(await r.text());await cargarEstudiantes();alert('Estudiante agregado. ID: '+codigo)}catch(e){alert('No se pudo agregar el estudiante.');console.error(e)}}
async function actualizar(i,patch){let e=data[i];try{const r=await fetch(SUPABASE_URL+'/rest/v1/estudiantes?id=eq.'+e.dbid,{method:'PATCH',headers:authHeaders({'Content-Type':'application/json'}),body:JSON.stringify(patch)});if(!r.ok)throw new Error(await r.text());return true}catch(err){alert('No se pudo guardar el cambio.');console.error(err);await cargarEstudiantes();return false}}
async function nombre(i,v){v=v.trim();if(!v){alert('El nombre no puede quedar vacío.');render();return}if(await actualizar(i,{nombre:v})){data[i].nombre=v;render()}}
async function tarea(i,v){let max=pesos(data[i].aula).ta;v=Math.max(0,Math.min(max,+v||0));if(await actualizar(i,{tareas:v})){data[i].tarea=v;render()}}
async function examen(i,j,v){v=Math.max(0,Math.min(100,+v||0));let patch={};patch['examen'+(j+1)]=v;if(await actualizar(i,patch)){data[i].examenes[j]=v;render()}}
async function borrar(i){if(!confirm('¿Eliminar a '+data[i].nombre+'? Esta acción no se puede deshacer.'))return;try{const r=await fetch(SUPABASE_URL+'/rest/v1/estudiantes?id=eq.'+data[i].dbid,{method:'DELETE',headers:authHeaders()});if(!r.ok)throw new Error(await r.text());await cargarEstudiantes()}catch(e){alert('No se pudo eliminar el estudiante.');console.error(e)}}
function render(){lista.innerHTML="";let f=document.getElementById('filtroAula')?.value||'Todos';data.forEach((e,i)=>{if(f!=="Todos"&&e.aula!==f)return;let c=calc(e),d=document.createElement("div");d.className="student";d.innerHTML=`<div class="head"><b>${safe(e.nombre)||"Estudiante"} · ID ${e.id}</b><button class="danger" onclick="borrar(${i})">Eliminar</button></div><div style="margin:7px 0 12px"><b>${safe(e.aula)}</b> · Ponderación ${c.p.ex}/${c.p.ta}</div><div class="fields"><div class="field"><label>Nombre</label><input value="${safe(e.nombre)}" onchange="nombre(${i},this.value)"></div><div class="field"><label>Tareas /${c.p.ta}</label><input type="number" min="0" max="${c.p.ta}" value="${e.tarea}" onchange="tarea(${i},this.value)"></div>${e.examenes.map((v,j)=>`<div class="field"><label>Examen ${j+1} /100</label><input type="number" min="0" max="100" value="${v}" onchange="examen(${i},${j},this.value)"></div>`).join("")}</div><div class="panel">Exámenes: <b>${c.xw.toFixed(2)}/${c.p.ex}</b> · Tareas: <b>${c.t.toFixed(2)}/${c.p.ta}</b> · Final: <b>${c.total.toFixed(2)}/100</b></div>`;lista.appendChild(d)});if(!lista.children.length)lista.innerHTML='<div class="panel">No hay estudiantes en esta aula.</div>'}
async function consultar(){
  let id=sid.value.trim();
  if(!/^\d{4}$/.test(id)){res.innerHTML='<div class="panel">Ingresa un ID válido de 4 dígitos.</div>';return}
  res.innerHTML='<div class="panel">Consultando calificación...</div>';
  try{
    const r=await fetch('https://pbltglzlhdxbyckawytl.supabase.co/rest/v1/rpc/consultar_nota',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':'sb_publishable_JoKqZmOf24YYatekuR8e1Q_Vem7Cg0W','Authorization':'Bearer sb_publishable_JoKqZmOf24YYatekuR8e1Q_Vem7Cg0W'},
      body:JSON.stringify({codigo_alumno:id})
    });
    if(!r.ok) throw new Error('HTTP '+r.status);
    const rows=await r.json();
    if(!Array.isArray(rows)||!rows.length){res.innerHTML='<div class="panel">ID no encontrado. Verifica los 4 dígitos.</div>';return}
    const a=rows[0];
    let e={nombre:a.nombre,aula:a.aula||"Tercer Nivel",tarea:Number(a.tareas)||0,examenes:[a.examen1,a.examen2,a.examen3,a.examen4,a.examen5].map(v=>Number(v)||0)};
    document.getElementById("consultaBox").classList.add("hidden");
    document.querySelector("#sv > p.center").classList.add("hidden");
    document.querySelector(".teacher").classList.add("hidden");
    let c=calc(e);
    res.innerHTML=`<div style="margin-bottom:15px"><button onclick="volverConsulta()">← Volver al menú principal</button></div><div class="panel"><h2>${safe(e.nombre)}</h2><p class="center"><b>${safe(e.aula)}</b></p><div class="cards"><div class="card">Tareas<b>${c.t.toFixed(2)}/${c.p.ta}</b></div>${c.xs.map((v,i)=>`<div class="card">Examen ${i+1}<b>${v.toFixed(2)}/100</b></div>`).join("")}<div class="card">Exámenes ponderados<b>${c.xw.toFixed(2)}/${c.p.ex}</b></div><div class="card">Nota final<b>${c.total.toFixed(2)}/100</b></div></div><p>Promedio de los 5 exámenes: <b>${c.avg.toFixed(2)}/100</b>.</p><h3>Gráfica de rendimiento</h3><div class="chart">${c.xs.map((v,i)=>`<div class="bw"><div class="bar" style="height:${v}%"></div><div class="lbl">E${i+1}<br>${v.toFixed(0)}%</div></div>`).join("")}<div class="bw"><div class="bar" style="height:${c.t/c.p.ta*100}%"></div><div class="lbl">Tareas<br>${(c.t/c.p.ta*100).toFixed(0)}%</div></div></div></div>`;
  }catch(err){res.innerHTML='<div class="panel">No se pudo conectar con Supabase. Revisa tu conexión a Internet e intenta de nuevo.</div>';console.error(err)}
}
function volverConsulta(){document.getElementById("consultaBox").classList.remove("hidden");document.querySelector("#sv > p.center").classList.remove("hidden");document.querySelector(".teacher").classList.remove("hidden");res.innerHTML="";sid.value="";sid.focus()}
function safe(x){return String(x||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
sid.addEventListener("keydown",e=>{if(e.key==="Enter")consultar()});
</script></body></html>
